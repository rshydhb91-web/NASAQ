      - name: Decrypt NASAQ signing key
        env:
          BACKUP_PASSWORD: ${{ secrets.NASAQ_BACKUP_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.NASAQ_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$BACKUP_PASSWORD" ]; then
            echo "::error::BACKUP_PASSWORD secret is empty"
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::KEY_PASSWORD secret is empty"
            exit 1
          fi

          if [ ! -f nasaq-release.jks.enc ]; then
            echo "::error::Encrypted signing file is missing"
            exit 1
          fi

          echo "Encrypted signing file found"

          if ! openssl enc -d -aes-256-cbc \
            -pbkdf2 \
            -in nasaq-release.jks.enc \
            -out android/app/nasaq-release.jks \
            -pass env:BACKUP_PASSWORD 2>/dev/null; then
            echo "::error::Unable to decrypt signing file"
            exit 1
          fi

          echo "Signing file decrypted"

          if ! keytool -list \
            -keystore android/app/nasaq-release.jks \
            -storepass env:KEY_PASSWORD \
            -alias nasaq > /dev/null 2>&1; then
            echo "::error::Unable to verify keystore password or alias"
            exit 1
          fi

          echo "Signing key verified successfully"
