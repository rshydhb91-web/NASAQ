
name: Build NASAQ APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/create-signing-key.yml'

permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: |
          flutter create --platforms=android \
            --project-name nasaq_app \
            --org com.nasaq .
      - name: Set NASAQ package ID
        run: |
          sed -i 's/applicationId = "com.nasaq.nasaq_app"/applicationId = "com.nasaq.app"/' android/app/build.gradle.kts
          grep 'applicationId' android/app/build.gradle.kts
      - name: Configure NASAQ application
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permission = (
              '<uses-permission '
              'android:name="android.permission.INTERNET" />'
          )

          if permission not in s:
              s = s.replace(
                  "<application",
                  permission + "\n    <application",
                  1
              )

          s, count = re.subn(
              r'android:label="[^"]*"',
              'android:label="نَسَق"',
              s,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "Unable to set application name"
              )

          p.write_text(s)
          print("Application name: نَسَق")
          print("Internet permission enabled")
          PY

      - name: Install icon library
        run: python3 -m pip install Pillow

      - name: Generate NASAQ icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          source = Path(
              "file_000000007d7081f4959b03c24b34beb7.png"
          )

          if not source.is_file():
              raise SystemExit(
                  "NASAQ icon image is missing"
              )

          image = Image.open(source).convert("RGBA")

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }

          for folder, size in sizes.items():
              target = (
                  Path("android/app/src/main/res")
                  / folder
              )
              target.mkdir(parents=True, exist_ok=True)

              icon = ImageOps.fit(
                  image,
                  (size, size),
                  method=Image.Resampling.LANCZOS,
                  centering=(0.5, 0.5)
              )

              icon.save(target / "ic_launcher.png")

          print("NASAQ application icon generated")
          PY

      - name: Download signing key from run 4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p signing-download

          gh run download 38051340102 \
            --repo "$GITHUB_REPOSITORY" \
            --name NASAQ-Encrypted-Signing-Key \
            --dir signing-download

          test -s signing-download/nasaq-release.jks.enc

          cp signing-download/nasaq-release.jks.enc \
            nasaq-release.jks.enc

          echo "Signing key downloaded from run 4"

      - name: Check signing file and secrets
        env:
          BACKUP_PASSWORD: ${{ secrets.NASAQ_BACKUP_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.NASAQ_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$BACKUP_PASSWORD" ]; then
            echo "::error::NASAQ_BACKUP_PASSWORD is missing"
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::NASAQ_KEYSTORE_PASSWORD is missing"
            exit 1
          fi

          if [ ! -s nasaq-release.jks.enc ]; then
            echo "::error::Encrypted signing file is missing"
            exit 1
          fi

          echo "Encrypted file found"
          echo "File size:"
          wc -c < nasaq-release.jks.enc

          echo "Encrypted file SHA256:"
          sha256sum nasaq-release.jks.enc

          echo "Signing secrets are configured"

      - name: Decrypt NASAQ signing key
        env:
          BACKUP_PASSWORD: ${{ secrets.NASAQ_BACKUP_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.NASAQ_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          if ! openssl enc -d -aes-256-cbc \
            -pbkdf2 \
            -in nasaq-release.jks.enc \
            -out android/app/nasaq-release.jks \
            -pass env:BACKUP_PASSWORD \
            2>/dev/null; then

            echo "::error::Decryption failed. The backup password does not match the encrypted file, or the file is damaged."
            exit 1
          fi

          echo "Signing file decrypted successfully"

          if ! keytool -list \
            -keystore android/app/nasaq-release.jks \
            -storepass:env KEY_PASSWORD \
            -alias nasaq \
            >/dev/null 2>&1; then

            echo "::error::Keystore password or alias is incorrect"
            exit 1
          fi

          echo "Signing key verified successfully"

      - name: Configure release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          old = (
              'signingConfig = '
              'signingConfigs.getByName("debug")'
          )

          if old not in s:
              raise SystemExit(
                  "Flutter debug signing line not found"
              )

          if "signingConfigs {" in s:
              raise SystemExit(
                  "Existing signing configuration found"
              )

          if "buildTypes {" not in s:
              raise SystemExit(
                  "Android buildTypes section not found"
              )

          config = '''
              signingConfigs {
                  create("nasaqRelease") {
                      storeFile = file("nasaq-release.jks")
                      storePassword = System.getenv(
                          "NASAQ_KEYSTORE_PASSWORD"
                      )
                      keyAlias = "nasaq"
                      keyPassword = System.getenv(
                          "NASAQ_KEYSTORE_PASSWORD"
                      )
                  }
              }

          '''

          s = s.replace(
              "buildTypes {",
              config + "buildTypes {",
              1
          )

          s = s.replace(
              old,
              'signingConfig = signingConfigs.getByName("nasaqRelease")',
              1
          )

          p.write_text(s)
          print("Release signing configured")
          PY

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build signed NASAQ APK
        env:
          NASAQ_KEYSTORE_PASSWORD: ${{ secrets.NASAQ_KEYSTORE_PASSWORD }}
        run: flutter build apk --release

      - name: Verify APK
        run: |
          set -euo pipefail

          APK=build/app/outputs/flutter-apk/app-release.apk

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 -maxdepth 1 -type d \
            | sort -V | tail -1)

          test -s "$APK"

          echo "=== APK SIZE ==="
          ls -lh "$APK"

          echo "=== PACKAGE INFORMATION ==="
          "$BUILD_TOOLS/aapt" dump badging "$APK" \
            | head -15

          echo "=== INTERNET PERMISSION ==="
          "$BUILD_TOOLS/aapt" dump permissions "$APK" \
            | grep android.permission.INTERNET

          echo "=== SIGNATURE ==="
          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            --print-certs "$APK"

          if "$BUILD_TOOLS/apksigner" verify \
            --print-certs "$APK" \
            | grep -q "CN=Android Debug"; then

            echo "::error::APK is debug signed"
            exit 1
          fi

          echo "NASAQ release APK verified successfully"

      - name: Upload NASAQ signed APK
        uses: actions/upload-artifact@v4
        with:
          name: NASAQ-Signed-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error
