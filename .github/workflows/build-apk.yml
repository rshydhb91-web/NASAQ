name: Build NASAQ APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        run: |
          flutter create --platforms=android --project-name nasaq_app --org com.nasaq .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Check APK information
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "=== APK SIZE ==="
          ls -lh "$APK"
          echo "=== PACKAGE INFORMATION ==="
          "$BUILD_TOOLS/aapt" dump badging "$APK" | head -30
          echo "=== SIGNATURE VERIFICATION ==="
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NASAQ-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
